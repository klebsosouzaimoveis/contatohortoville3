<script>

  // Carrossel
  var track = document.getElementById("track");
  var dotsBox = document.getElementById("dots");
  var slides = track.children, n = slides.length, cur = 0, timer;
  var cap = document.getElementById("caption");

  for (var i = 0; i < n; i++) {
    (function (i) {
      var b = document.createElement("button");
      b.setAttribute("aria-label", "Foto " + (i + 1));
      b.addEventListener("click", function () { go(i); restart(); });
      dotsBox.appendChild(b);
    })(i);
  }
  function mark() {
    cap.textContent = slides[cur].getAttribute("data-label");
    for (var i = 0; i < n; i++) dotsBox.children[i].setAttribute("aria-current", i === cur ? "true" : "false");
  }
  function go(i) {
    cur = (i + n) % n;
    track.scrollTo({ left: cur * track.clientWidth, behavior: "smooth" });
    mark();
  }
  track.addEventListener("scroll", function () {
    var i = Math.round(track.scrollLeft / track.clientWidth);
    if (i !== cur) { cur = i; mark(); }
  }, { passive: true });

  function restart() {
    clearInterval(timer);
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    timer = setInterval(function () { go(cur + 1); }, 4000);
  }
  track.addEventListener("touchstart", function () { clearInterval(timer); }, { passive: true });
  track.addEventListener("touchend", restart, { passive: true });
  mark(); restart();
</script>
